<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gothic QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #32153d,
          #0a0710 48%,
          #030205
        );
      color: #f7eaff;
      font-family:
        Georgia,
        "Times New Roman",
        serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: min(520px, 100%);
    }

    .title {
      text-align: center;
      font-size: 28px;
      color: #e879f9;
      letter-spacing: 2px;
      margin-top: 15px;
    }

    .subtitle {
      text-align: center;
      color: #a99bb4;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .scanner {
      background: #100b15;
      border: 1px solid #59356e;
      padding: 12px;
      box-shadow:
        0 0 40px rgba(168,85,247,.15);
    }

    #reader {
      width: 100%;
    }

    #reader video {
      width: 100% !important;
      border-radius: 0 !important;
    }

    .result {
      margin-top: 15px;
      border: 1px solid #3f2850;
      background: #130c19;
      padding: 15px;
      min-height: 100px;
    }

    .success {
      color: #43e6a4;
    }

    .error {
      color: #ff6680;
    }

    .warning {
      color: #e8c875;
    }

    .student {
      font-size: 22px;
      color: #e879f9;
      margin-bottom: 5px;
    }

    .detail {
      color: #aaa;
      font-size: 13px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 1px solid #694084;
      background: #241230;
      color: #f5eaff;
      font-family: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #341746;
    }

    .loading {
      color: #c4a1ff;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="title">
    ☾ GOTHIC QR SCANNER
  </div>

  <div class="subtitle">
    SCANNER ABSENSI SISWA
  </div>

  <div class="scanner">

    <div id="reader"></div>

  </div>

  <div
    id="result"
    class="result"
  >
    <div class="loading">
      Arahkan kamera ke QR Code siswa.
    </div>
  </div>

  <button
    onclick="startScanner()"
  >
    ◉ AKTIFKAN KAMERA
  </button>

</div>


<script>

  /*
   * ===================================================
   * URL GOOGLE APPS SCRIPT
   * ===================================================
   *
   * GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA.
   *
   * Contoh:
   *
   * const APPS_SCRIPT_URL =
   *   'https://script.google.com/macros/s/XXXX/exec';
   *
   */

  const APPS_SCRIPT_URL =
    'GANTI_DENGAN_URL_WEB_APP_GOOGLE_APPS_SCRIPT';


  let scanner = null;

  let locked = false;



  /* ===================================================
     START SCANNER
     =================================================== */

  function startScanner() {

    if (scanner) {

      try {
        scanner.clear();
      } catch(e) {}

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.min(
            width,
            height
          ) * 0.72;

        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0

    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {
        // Abaikan frame yang belum terbaca.
      }

    ).catch(function(error) {

      showResult(
        '<div class="error">' +
        'Kamera tidak dapat dibuka.<br><br>' +
        'Pastikan izin kamera diberikan pada browser.' +
        '</div>'
      );

    });

  }



  /* ===================================================
     QR SUCCESS
     =================================================== */

  function onScanSuccess(
    decodedText
  ) {

    if (locked) return;

    locked = true;


    showResult(
      '<div class="loading">' +
      'QR terbaca. Menghubungkan ke database...' +
      '</div>'
    );


    /*
     * Panggil Web App Google Apps Script.
     */
    const url =
      APPS_SCRIPT_URL +
      '?action=scan&qr=' +
      encodeURIComponent(
        decodedText
      );


    fetch(
      url,
      {
        method: 'GET',
        mode: 'cors'
      }
    )
    .then(function(response) {

      return response.json();

    })
    .then(function(data) {

      if (data.success) {

        showResult(`

          <div class="success">
            ✓ ABSENSI BERHASIL
          </div>

          <br>

          <div class="student">
            ${escapeHtml(data.siswa.nama)}
          </div>

          <div class="detail">

            NIS:
            ${escapeHtml(data.siswa.nis)}
            <br>

            Kelas:
            ${escapeHtml(data.siswa.nama_kelas)}
            <br>

            Tanggal:
            ${escapeHtml(data.tanggal)}
            <br>

            Waktu:
            ${escapeHtml(data.waktu)}
            <br>

            Status:
            <strong>
              ${escapeHtml(data.status)}
            </strong>

          </div>

        `);

      } else {

        if (data.duplicate) {

          showResult(`

            <div class="warning">
              ⚠ ABSENSI SUDAH TERCATAT
            </div>

            <br>

            <div class="student">
              ${escapeHtml(data.siswa.nama)}
            </div>

            <div class="detail">

              NIS:
              ${escapeHtml(data.siswa.nis)}
              <br>

              Kelas:
              ${escapeHtml(data.siswa.nama_kelas)}
              <br>

              Waktu sebelumnya:
              ${escapeHtml(data.waktu)}

            </div>

          `);

        } else {

          showResult(`

            <div class="error">
              ✕ ${escapeHtml(data.message)}
            </div>

          `);

        }

      }

    })
    .catch(function(error) {

      /*
       * Fallback melalui JSONP-style redirect
       * tidak digunakan karena keamanan.
       */
      showResult(`

        <div class="error">
          Gagal menghubungi database.
        </div>

        <div class="detail">
          ${escapeHtml(error.message)}
        </div>

      `);

    })
    .finally(function() {

      setTimeout(
        function() {
          locked = false;
        },
        2500
      );

    });

  }



  /* ===================================================
     RESULT
     =================================================== */

  function showResult(html) {

    document.getElementById(
      'result'
    ).innerHTML = html;

  }



  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) return '';

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }



  /*
   * Aktifkan kamera otomatis.
   */
  window.addEventListener(
    'load',
    function() {
      startScanner();
    }
  );

</script>

</body>
</html>
